# Cloudflare Workers deploy of the multiplayer server (free plan, no card).
name = "hanami-days-server"
main = "server/src/worker.js"
compatibility_date = "2025-01-01"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[vars]
# Only the game site may open a WebSocket to this server (comma separate to add more).
ALLOWED_ORIGINS = "https://hanamidays.netlify.app"
