<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffd9e6" />
    <title>Hanami Days Online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Show startup crashes on screen instead of leaving a blank page.
      (function () {
        function show(msg) {
          var d = document.getElementById('boot-error');
          if (!d) {
            d = document.createElement('pre');
            d.id = 'boot-error';
            d.style.cssText = 'position:fixed;inset:0;margin:0;padding:20px;overflow:auto;background:#fff0f5;color:#7a1f3d;font:13px/1.5 monospace;white-space:pre-wrap;z-index:99999';
            document.body.appendChild(d);
          }
          d.textContent = 'Hanami Days failed to start.\nPlease send this message to the developer:\n\n' + msg;
        }
        window.addEventListener('error', function (e) { show((e.message || 'Error') + (e.filename ? '\n' + e.filename + ':' + e.lineno : '')); });
        window.addEventListener('unhandledrejection', function (e) {
          var msg = String((e.reason && (e.reason.stack || e.reason.message)) || e.reason);
          var root = document.getElementById('root');
          // Once the game is on screen a stray rejection (pointer lock refused, a failed fetch...) is not a crash
          if (/pointer ?lock/i.test(msg) || (root && root.childElementCount > 0)) { console.warn('Unhandled rejection ignored:', msg); return; }
          show('Unhandled: ' + msg);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
